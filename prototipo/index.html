<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thalita Mariano Protótipo</title>
<meta name="description" content="Protótipo do motor de make da Thalita Mariano: estudo do rosto, receita, prévia, espelho ao vivo e Beauty Brief.">
<meta name="theme-color" content="#1B1311">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Hanken+Grotesk:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: no celular, uma coluna com o botão principal no polegar; no computador, tela dividida (painel visual à esquerda, fluxo à direita). Telas de câmera e de espera usam o "palco" escuro. */
:root {
  --po: #F7EDE8;
  --nude: #EFDDD5;
  --nude-2: #E6D2C8;
  --cacau: #2B1A15;
  --cacau-fg: #F7EDE8;
  --terra: #7A5446;
  --champanhe: #D6B588;
  --champanhe-forte: #B8925E;
  --palco: #1B1311;
  --palco-2: #2A1E1A;
  --palco-texto: #F3E6DE;
  --palco-apoio: #BFA99C;
  --desabilitado: #A39490;
  --sucesso: #4E7A52;
  --alerta: #A86A1F;
  --erro: #A3392E;
  --f-titulo: "Plus Jakarta Sans", "Hanken Grotesk", system-ui, sans-serif;
  --f-texto: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-marca: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --raio-foto: 28px;
  --raio-campo: 18px;
  --sombra: 0 10px 30px -12px rgb(43 26 21 / 0.35);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--po);
  color: var(--cacau);
  font: 400 17px/1.5 var(--f-texto);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--champanhe-forte); outline-offset: 3px; border-radius: 8px; }
img, canvas, video, svg { max-width: 100%; display: block; }
.tabular { font-variant-numeric: tabular-nums; }

/* ---------- estrutura ---------- */
#app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.painel { display: none; }
.fluxo { min-width: 0; width: 100%; max-width: 560px; margin: 0 auto; padding: max(env(safe-area-inset-top), 20px) 20px calc(var(--altura-acoes, 120px) + 24px); display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 1000px) {
  #app { grid-template-columns: minmax(0, 1.55fr) minmax(420px, 1fr); }
  .painel { display: block; position: sticky; top: 0; height: 100vh; overflow: hidden; background: var(--palco); color: #fff; }
  .fluxo { max-width: 600px; padding: 48px 56px calc(var(--altura-acoes, 120px) + 32px); }
  body[data-palco] .fluxo { max-width: 600px; }
}
body[data-palco] { background: var(--palco); color: var(--palco-texto); }
body[data-palco] .fluxo { max-width: 640px; }
@media (min-width: 1000px) { body[data-palco] #app { grid-template-columns: 1fr; } body[data-palco] .painel { display: none; } }

/* painel visual (computador) */
.painel-fundo { position: absolute; inset: 0; }
.painel-fundo canvas, .painel-fundo img { width: 100%; height: 100%; object-fit: cover; }
.painel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(27 19 17 / .35), transparent 30%, transparent 60%, rgb(27 19 17 / .75)); pointer-events: none; }
.painel .marca { position: absolute; left: 48px; top: 44px; z-index: 2; color: #F7EDE8; font-size: 30px; }
.painel-legenda { position: absolute; left: 48px; bottom: 48px; right: 48px; z-index: 2; font: 400 22px/1.4 var(--f-texto); color: #F7EDE8; max-width: 26ch; text-wrap: balance; }

/* marca */
.marca { display: inline-flex; align-items: center; gap: .45em; font-family: var(--f-marca); font-weight: 400; letter-spacing: .01em; line-height: 1; white-space: nowrap; font-size: 22px; }
.monograma { font-family: var(--f-marca); color: var(--champanhe); font-size: 1.35em; letter-spacing: -.12em; font-weight: 400; padding-right: .12em; }

/* topo do fluxo */
.topo { display: flex; align-items: center; gap: 16px; min-height: 44px; }
.voltar { width: 44px; height: 44px; margin-left: -12px; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; }
.voltar svg { width: 22px; height: 22px; }
.progresso { flex: 1; height: 3px; border-radius: 3px; background: var(--nude-2); overflow: hidden; }
.progresso > i { display: block; height: 100%; background: var(--champanhe); border-radius: 3px; transition: width .5s ease; }
body[data-palco] .progresso { background: rgb(255 255 255 / .14); }

/* tipografia */
h1, h2, h3 { font-family: var(--f-titulo); font-weight: 600; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(32px, 7.6vw, 52px); line-height: 1.04; }
h2 { font-size: 24px; line-height: 1.15; letter-spacing: -.02em; }
h3 { font-size: 18px; line-height: 1.25; letter-spacing: -.01em; }
.apoio { color: var(--terra); font-size: 16px; margin: 6px 0 0; }
body[data-palco] .apoio { color: var(--palco-apoio); }
.rotulo { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--terra); font-weight: 600; }
body[data-palco] .rotulo { color: var(--palco-apoio); }
p { margin: 0; }

/* botões */
.acoes { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--po) 70%, transparent); display: flex; flex-direction: column; gap: 10px; z-index: 20; }
body[data-palco] .acoes { background: linear-gradient(to top, var(--palco) 70%, transparent); }
.acoes > * { width: 100%; max-width: 520px; margin: 0 auto; }
@media (min-width: 1000px) { .acoes { left: auto; width: calc(100% / 2.55 * 1); min-width: 420px; padding-inline: 56px; } body[data-palco] .acoes { width: 100%; } }
.botao { min-height: 56px; border-radius: 999px; border: 0; padding: 0 24px; font: 600 18px/1 var(--f-titulo); letter-spacing: -.01em; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s ease, opacity .2s; }
.botao:active { transform: scale(.98); }
.botao.principal { background: var(--cacau); color: var(--cacau-fg); box-shadow: var(--sombra); }
.botao.principal:disabled { background: var(--desabilitado); box-shadow: none; cursor: not-allowed; }
.botao.secundario { background: transparent; color: var(--cacau); border: 1px solid rgb(122 84 70 / .45); }
.botao.claro { background: var(--po); color: var(--cacau); }
.botao.champanhe { background: var(--champanhe); color: var(--cacau); }
body[data-palco] .botao.secundario { color: var(--palco-texto); border-color: rgb(255 255 255 / .28); }
.link { background: none; border: 0; color: var(--cacau); text-decoration: underline; text-underline-offset: 4px; font-weight: 500; padding: 10px; }
body[data-palco] .link { color: var(--palco-texto); }
.botao svg, .chip svg { width: 20px; height: 20px; flex: none; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chips.rolagem { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding-inline: 20px; scroll-snap-type: x proximity; }
.chips.rolagem::-webkit-scrollbar { display: none; }
.chip { min-height: 44px; border-radius: 999px; padding: 0 18px; border: 1px solid rgb(122 84 70 / .35); background: transparent; font-weight: 500; font-size: 16px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; scroll-snap-align: start; }
.chip[aria-pressed="true"] { background: var(--cacau); color: var(--cacau-fg); border-color: var(--cacau); }
body[data-palco] .chip { border-color: rgb(255 255 255 / .22); color: var(--palco-texto); }
body[data-palco] .chip[aria-pressed="true"] { background: var(--champanhe); color: var(--cacau); border-color: var(--champanhe); }

/* cards de momento */
.grade-momentos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card-momento { position: relative; aspect-ratio: 4 / 5; border-radius: var(--raio-foto); overflow: hidden; border: 0; padding: 0; text-align: left; color: #fff; background: var(--palco-2); }
.card-momento:last-child:nth-child(odd) { grid-column: 1 / -1; aspect-ratio: 16 / 10; }
.card-momento canvas, .card-momento svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.card-momento::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(27 19 17 / .78), transparent 55%); }
.card-momento span { position: absolute; left: 20px; bottom: 16px; z-index: 2; font: 600 21px/1.1 var(--f-titulo); letter-spacing: -.02em; }
.selo { position: absolute; top: 14px; right: 14px; z-index: 2; width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .85); display: grid; place-items: center; }
.selo svg { width: 16px; height: 16px; opacity: 0; }
[aria-pressed="true"] .selo, [aria-checked="true"] .selo { background: var(--champanhe); border-color: var(--champanhe); }
[aria-pressed="true"] .selo svg, [aria-checked="true"] .selo svg { opacity: 1; color: var(--cacau); }
.card-momento[aria-pressed="true"] { outline: 3px solid var(--champanhe); outline-offset: 3px; }

/* papel */
.lista-papeis { display: flex; flex-direction: column; gap: 14px; }
.card-papel { display: grid; grid-template-columns: minmax(0, 1fr) auto 32px; align-items: center; gap: 14px; text-align: left; border-radius: 24px; border: 1px solid var(--nude-2); background: transparent; padding: 20px 22px; }
.card-papel[aria-checked="true"] { background: var(--nude); border-color: var(--cacau); }
.card-papel strong { font: 600 20px/1.2 var(--f-titulo); letter-spacing: -.02em; display: block; }
.card-papel small { display: block; color: var(--terra); font-size: 15px; margin-top: 4px; }
.preco { text-align: right; font-size: 13px; color: var(--terra); line-height: 1.3; }
.preco b { display: block; font: 600 18px/1.2 var(--f-titulo); color: var(--cacau); }
.card-papel .selo { position: static; border-color: rgb(122 84 70 / .5); }

/* estilos */
.carrossel { display: grid; grid-auto-flow: column; grid-auto-columns: min(78%, 300px); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -20px; padding: 4px 20px 8px; scrollbar-width: none; }
.carrossel::-webkit-scrollbar { display: none; }
.card-estilo { scroll-snap-align: start; border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.card-estilo .ilustra { position: relative; aspect-ratio: 4 / 5; border-radius: var(--raio-foto); overflow: hidden; background: var(--nude); border: 3px solid transparent; }
.card-estilo[aria-pressed="true"] .ilustra { border-color: var(--champanhe); }
.card-estilo .ilustra svg { width: 100%; height: 100%; }
.etiqueta { position: absolute; top: 12px; left: 12px; background: rgb(27 19 17 / .6); color: #F7EDE8; font-size: 12px; padding: 5px 10px; border-radius: 999px; backdrop-filter: blur(6px); }
.card-estilo strong { font: 600 18px/1.2 var(--f-titulo); letter-spacing: -.01em; }
.card-estilo small { color: var(--terra); font-size: 15px; display: block; }

/* foto e câmera */
.moldura-foto { position: relative; border-radius: var(--raio-foto); overflow: hidden; background: var(--palco-2); aspect-ratio: 3 / 4; }
.moldura-foto > img, .moldura-foto > video, .moldura-foto > canvas { width: 100%; height: 100%; object-fit: cover; }
.moldura-foto canvas.sobre { position: absolute; inset: 0; pointer-events: none; }
.cantos { position: absolute; inset: 9% 11%; pointer-events: none; }
.cantos i { position: absolute; width: 44px; height: 44px; border: 2px solid var(--champanhe); }
.cantos i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.cantos i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
.cantos i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
.cantos i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
.pilula { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--champanhe); color: var(--cacau); font-weight: 500; font-size: 15px; padding: 7px 16px; border-radius: 999px; white-space: nowrap; z-index: 3; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.pilula.atencao { background: #F2D9B8; }
.pilula.erro { background: #F0C9C2; }
.faixa-scan { position: absolute; left: 6%; right: 6%; height: 18%; border-radius: 40px; background: linear-gradient(180deg, transparent, rgb(255 244 232 / .55), transparent); filter: blur(2px); animation: scan 2.6s ease-in-out infinite; pointer-events: none; }
@keyframes scan { 0%, 100% { top: 14%; } 50% { top: 66%; } }
.obturador { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--champanhe); background: none; padding: 6px; margin: 0 auto; display: block; }
.obturador::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--champanhe); }
.obturador:disabled { opacity: .35; }
.exemplo { position: absolute; left: 14px; bottom: 14px; background: rgb(27 19 17 / .6); color: #F7EDE8; font-size: 14px; padding: 6px 12px; border-radius: 999px; }
.nota { font-size: 14px; color: var(--terra); text-align: center; }
body[data-palco] .nota { color: var(--palco-apoio); }

/* campos */
.campo { display: flex; flex-direction: column; gap: 8px; }
.campo label { font-weight: 500; color: var(--terra); }
.caixa-texto { position: relative; }
.caixa-texto textarea { width: 100%; min-height: 104px; resize: vertical; border: 0; border-radius: var(--raio-campo); background: var(--nude); padding: 16px 70px 16px 18px; }
.caixa-texto .mic { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--cacau); color: var(--cacau-fg); display: grid; place-items: center; }
.ajuda { font-size: 14px; color: var(--terra); }
.consentimento { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; }
.consentimento input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--cacau); }

/* listas de checagem */
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 15px; }
.checks li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; margin: 6px 0 0 6px; background: var(--sucesso); }
.checks li.atencao::before { background: var(--alerta); }
.checks li.erro::before { background: var(--erro); }
.checks li.espera::before { background: rgb(214 181 136 / .35); }
.checks li.ativo::before { background: var(--champanhe); box-shadow: 0 0 0 4px rgb(214 181 136 / .25); animation: pulso 1s ease-in-out infinite; }
@keyframes pulso { 50% { box-shadow: 0 0 0 8px rgb(214 181 136 / .08); } }
.checks small { display: block; color: var(--terra); }
body[data-palco] .checks small { color: var(--palco-apoio); }

/* resultado */
.comparar { position: relative; border-radius: var(--raio-foto); overflow: hidden; aspect-ratio: 3 / 4; background: var(--palco-2); touch-action: none; user-select: none; }
.comparar canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.comparar .depois { clip-path: inset(0 0 0 var(--corte, 50%)); }
.comparar .divisor { position: absolute; top: 0; bottom: 0; left: var(--corte, 50%); width: 2px; background: #fff; transform: translateX(-1px); }
.comparar .divisor::after { content: ""; position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); box-shadow: var(--sombra); }
.comparar .rot { position: absolute; bottom: 14px; font-size: 13px; background: rgb(27 19 17 / .6); color: #fff; padding: 4px 10px; border-radius: 999px; }
.comparar .rot.a { left: 14px; } .comparar .rot.d { right: 14px; }
.grade-estudo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ficha { background: var(--nude); border-radius: 20px; padding: 16px; min-width: 0; }
body[data-palco] .ficha { background: var(--palco-2); }
.ficha .rotulo { font-size: 11px; }
.ficha b { display: block; font: 600 17px/1.25 var(--f-titulo); margin-top: 4px; letter-spacing: -.01em; }
.ficha small { display: block; color: var(--terra); font-size: 13px; margin-top: 2px; }
.amostra { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .8); box-shadow: 0 0 0 1px rgb(43 26 21 / .12); display: inline-block; vertical-align: middle; }
.linha-amostras { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.aviso { border-radius: 20px; padding: 16px 18px; background: var(--nude); font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.aviso.champanhe { background: #F1E2CB; }
.lista-motivos { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
details { border-radius: 20px; background: var(--nude); padding: 4px 18px; }
details > summary { cursor: pointer; padding: 14px 0; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details > summary::after { content: "+"; font-size: 22px; color: var(--terra); }
details[open] > summary::after { content: "−"; }
pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: rgb(255 255 255 / .55); padding: 12px; border-radius: 12px; max-height: 420px; overflow: auto; }

/* modo ao vivo */
.espelho { position: relative; margin-inline: -20px; background: #000; aspect-ratio: 3 / 4; max-height: 62vh; overflow: hidden; }
@media (min-width: 640px) { .espelho { margin-inline: 0; border-radius: var(--raio-foto); } }
.espelho canvas { width: 100%; height: 100%; object-fit: cover; }
.espelho video { display: none; }
.espelho .comparar-btn { position: absolute; right: 14px; bottom: 14px; width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgb(27 19 17 / .55); color: #fff; display: grid; place-items: center; backdrop-filter: blur(6px); touch-action: none; }
.espelho .estado-espelho { position: absolute; left: 14px; bottom: 14px; font-size: 13px; color: #fff; background: rgb(27 19 17 / .55); padding: 6px 12px; border-radius: 999px; }
.abas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding-inline: 20px; }
.abas::-webkit-scrollbar { display: none; }
.aba { flex: none; border: 0; background: none; color: var(--palco-apoio); padding: 10px 12px; font-weight: 600; font-size: 15px; border-bottom: 2px solid transparent; }
.aba[aria-selected="true"] { color: var(--palco-texto); border-color: var(--champanhe); }
.cores { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding: 6px 20px 4px; scroll-snap-type: x proximity; }
.cores::-webkit-scrollbar { display: none; }
.cor { flex: none; width: 64px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--palco-apoio); font-size: 11px; line-height: 1.2; text-align: center; scroll-snap-align: center; }
.cor i { width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .18); transition: transform .15s; }
.cor[aria-pressed="true"] i { outline: 2px solid var(--champanhe); outline-offset: 3px; transform: scale(1.06); }
.cor[aria-pressed="true"] { color: var(--palco-texto); }
.cor.nenhuma i { background: repeating-linear-gradient(45deg, transparent 0 6px, rgb(255 255 255 / .2) 6px 8px); }
.cor.outra { cursor: pointer; position: relative; }
.cor.outra i { background: conic-gradient(from 90deg, #E0533D, #E8B04A, #8FBF6A, #4FA3C7, #8C6BC2, #D9557F, #E0533D); display: grid; place-items: center; }
.cor.outra i b { width: 22px; height: 22px; border-radius: 50%; background: var(--palco); color: var(--palco-texto); font: 600 18px/22px var(--fonte-ui, sans-serif); }
.cor.outra.escolhida i { background: var(--cor-livre); }
.cor.outra.escolhida i b { display: none; }
.cor.outra input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.cor.outra:focus-within i { outline: 2px solid var(--champanhe); outline-offset: 3px; }
.controle { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; font-size: 14px; color: var(--palco-apoio); }
input[type="range"] { width: 100%; accent-color: var(--champanhe); height: 32px; }
.previa-foto { position: relative; border-radius: var(--raio-foto); overflow: hidden; }
.previa-foto img { width: 100%; }

/* studio (Beauty Brief) */
.brief { display: flex; flex-direction: column; gap: 18px; }
.brief-cab { display: flex; flex-direction: column; gap: 6px; }
.brief-chart { background: #FFFDFB; border-radius: var(--raio-foto); padding: 12px; border: 1px solid var(--nude-2); }
.brief-chart svg { width: 100%; height: auto; }
.brief-secao { background: #FFFDFB; border: 1px solid var(--nude-2); border-radius: 22px; padding: 18px; }
.brief-secao h3 { margin-bottom: 10px; }
.brief-linha { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--nude); font-size: 15px; }
.brief-linha:first-of-type { border-top: 0; }
.brief-linha span:first-child { color: var(--terra); }
.conf { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--nude); color: var(--terra); margin-left: 6px; }
.ordem { list-style: none; margin: 0; padding: 0; counter-reset: passo; display: flex; flex-direction: column; gap: 10px; }
.ordem li { counter-increment: passo; display: grid; grid-template-columns: 32px 1fr; gap: 12px; font-size: 15px; }
.ordem li::before { content: counter(passo); width: 28px; height: 28px; border-radius: 50%; background: var(--cacau); color: var(--cacau-fg); display: grid; place-items: center; font: 600 13px/1 var(--f-titulo); }
.ordem small { display: block; color: var(--terra); margin-top: 2px; }
.paleta { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.paleta div { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; font-size: 13px; line-height: 1.25; min-width: 0; }
.paleta i { width: 36px; height: 36px; border-radius: 10px; }
.paleta small { color: var(--terra); display: block; }

/* bastidores */
.etapas-motor { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.etapas-motor li { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--nude-2); font-size: 15px; align-items: start; }
.etapas-motor li:first-child { border-top: 0; }
.etapas-motor .tipo { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--nude); color: var(--terra); white-space: nowrap; }
.etapas-motor .tipo.ia { background: #F1E2CB; color: #7A5A2A; }
.etapas-motor .tipo.regra { background: #E3E8DD; color: #4E6A44; }

/* início */
.capa { display: flex; flex-direction: column; gap: 26px; padding-top: 8px; }
.capa .hero { position: relative; border-radius: var(--raio-foto); overflow: hidden; background: var(--palco); aspect-ratio: 4 / 5; }
.capa .hero canvas { width: 100%; height: 100%; }
@media (min-width: 1000px) { .capa .hero { display: none; } }
.modos { display: grid; gap: 14px; }
.modo { display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: center; text-align: left; border: 1px solid var(--nude-2); border-radius: 24px; padding: 18px; background: transparent; }
.modo .icone { width: 56px; height: 56px; border-radius: 18px; background: var(--nude); display: grid; place-items: center; }
.modo .icone svg { width: 26px; height: 26px; }
.modo strong { font: 600 19px/1.2 var(--f-titulo); letter-spacing: -.02em; display: block; }
.modo small { display: block; color: var(--terra); font-size: 15px; margin-top: 3px; }
.rodape-links { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--cacau); color: var(--cacau-fg); padding: 12px 18px; border-radius: 14px; font-size: 15px; z-index: 50; box-shadow: var(--sombra); max-width: calc(100% - 40px); }
.sobreposicao { position: fixed; inset: 0; background: rgb(27 19 17 / .92); z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; color: #fff; }
.sobreposicao img { max-height: 70vh; border-radius: 18px; }

.so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <aside class="painel" aria-hidden="true">
    <div class="painel-fundo" id="painel-fundo"></div>
    <span class="marca"><span class="monograma">TM</span>Thalita Mariano</span>
    <p class="painel-legenda" id="painel-legenda">Maquiagem com a sua cara.</p>
  </aside>
  <main class="fluxo" id="fluxo" tabindex="-1"></main>
</div>
<div class="acoes" id="acoes"></div>
<div id="avisos" aria-live="polite"></div>
<noscript>Este protótipo precisa de JavaScript.</noscript>
<script type="module" src="./js/app.js"></script>
</body>
</html>
